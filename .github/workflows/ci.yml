name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  # The whole sample as docker-compose.yml runs it, with two relays, driven through the API: events go
  # outbox → relay → RabbitMQ → both consumers, and the checks read each consumer's database, the
  # workers' health and admin endpoints, and the metrics in Prometheus.
  compose:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack with two relays
        run: docker compose up -d --build --scale producer-worker=2

      - name: Wait for every service to be ready and for the consumers' queues
        run: |
          ready() { curl -sf "http://localhost:$1/health/ready" >/dev/null; }
          for i in $(seq 1 90); do
            ready 8080 && ready 8081 && ready 8082 && ready 8083 && ready 8084 \
              && [ "$(curl -s -u gm-admin:gm-admin-secret http://localhost:15672/api/queues | jq '[.[] | select(.name | startswith("gm.consumer-"))] | length')" = "6" ] \
              && exit 0
            sleep 2
          done
          docker compose ps
          for port in 8080 8081 8082 8083 8084; do echo "== :$port/health/ready"; curl -s -w ' (HTTP %{http_code})\n' "http://localhost:$port/health/ready"; done
          curl -s -u gm-admin:gm-admin-secret http://localhost:15672/api/queues | jq -r '.[].name'
          docker compose logs --tail 50; exit 1

      - name: Place an order, pay it, register users and change stock
        run: |
          set -e
          api=http://localhost:8080/api/v1
          order=$(cat /proc/sys/kernel/random/uuid)
          echo "ORDER=$order" >> "$GITHUB_ENV"
          curl -sf -H 'Content-Type: application/json' "$api/orders" \
            -d "{\"orderId\":\"$order\",\"customerId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"totalAmount\":42.5,\"currency\":\"EUR\"}"
          curl -sf -H 'Content-Type: application/json' "$api/payments" \
            -d "{\"paymentId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"orderId\":\"$order\",\"amount\":42.5,\"status\":\"Succeeded\"}"
          curl -sf -H 'Content-Type: application/json' "$api/users" \
            -d "{\"userId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"email\":\"ana@example.test\",\"name\":\"Ana\"}"
          curl -sf -H 'Content-Type: application/json' "$api/users" \
            -d "{\"userId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"email\":\"nobody@bounce.test\",\"name\":\"Bounce\"}"
          curl -sf -H 'Content-Type: application/json' "$api/inventory" \
            -d "{\"productId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"warehouse\":\"TBS-1\",\"quantityDelta\":5,\"newQuantity\":5}"
          # ConsumerA fails orders in XXX on purpose: Wolverine retries, the inbox records each attempt,
          # and the message ends up in the broker's dead-letter queue.
          curl -sf -H 'Content-Type: application/json' "$api/orders" \
            -d "{\"orderId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"customerId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"totalAmount\":1,\"currency\":\"XXX\"}"

      - name: Every consumer handled its events once, in order, and failures were recorded
        run: |
          q() { docker compose exec -T postgres psql -U postgres -d "$1" -tAc "$2"; }
          check() {
            for i in $(seq 1 45); do [ "$(q "$1" "$2")" = "$3" ] && return 0; sleep 2; done
            echo "FAILED on $1: $2 (expected $3, got $(q "$1" "$2"))"; docker compose logs --tail 80; exit 1
          }
          # The relays published all six events (the outbox is empty of pending messages).
          check messaging_api "select count(*) from messaging.outbox_messages where processed_at_utc is null" 0
          # ConsumerA recorded the order, the payment and both users (not the XXX order) ...
          check messaging_consumer_a "select count(*) from application.customer_activities" 4
          # ... and kept retrying the XXX order, with the error on its inbox row.
          check messaging_consumer_a "select count(*) > 0 from messaging.inbox_messages where processed_at_utc is null and attempts >= 2 and error like '%XXX%'" t
          # After the broker's last delivery (first try + 3 retries) the row is dead-lettered too (GM.Messaging 4.1).
          check messaging_consumer_a "select count(*) from messaging.inbox_messages where dead_lettered_at_utc is not null and attempts = 4 and error like '%XXX%'" 1
          # ConsumerB's timeline has the order before its payment (ordering key + sequential queue).
          check messaging_consumer_b "select string_agg(kind, ',' order by recorded_at_utc) from application.order_timeline where order_id = '$ORDER'" "placed,payment-succeeded"
          check messaging_consumer_b "select count(*) from application.stock_levels where warehouse_code = 'TBS-1'" 1
          # The inbox worker sent Ana's welcome email and dead-lettered the bounce after its last attempt.
          check messaging_consumer_b "select count(*) from application.welcome_emails" 1
          check messaging_consumer_b "select count(*) from messaging.inbox_messages where dead_lettered_at_utc is not null and attempts = 3" 1

      - name: Personal data is encrypted everywhere but in the handlers
        run: |
          set -e
          q() { docker compose exec -T postgres psql -U postgres -d "$1" -tAc "$2"; }
          # UserRegistered's email and name are [SensitiveData]: the outbox row and the consumers' inbox rows hold ciphertext ...
          [ "$(q messaging_api "select count(*) from messaging.outbox_messages where event_type = 'users.user-registered' and payload like '%gmenc:%' and payload not like '%example.test%'")" = "2" ]
          [ "$(q messaging_consumer_b "select count(*) from messaging.inbox_messages where event_type = 'users.user-registered' and payload like '%example.test%'")" = "0" ]
          [ "$(q messaging_consumer_a "select count(*) from messaging.inbox_messages where event_type = 'users.user-registered' and payload like '%example.test%'")" = "0" ]
          # ... while the handler got the plain address and sent the welcome email to it.
          [ "$(q messaging_consumer_b "select email from application.welcome_emails")" = "ana@example.test" ]
          # Each user's values are encrypted with their own key (gmenc:s1, [DataSubject] UserId), kept in the shared
          # messaging_keys database wrapped by the current key-ring key.
          [ "$(q messaging_api "select count(*) from messaging.outbox_messages where event_type = 'users.user-registered' and payload like '%gmenc:s1:%'")" = "2" ]
          [ "$(q messaging_keys "select count(*) from messaging.subject_keys where wrapped_key like 'k1:sample-2026-11:%'")" = "2" ]

      - name: RabbitMQ is TLS-only, with a user per service
        run: |
          set -e
          # The plain AMQP port is closed; the TLS one presents a certificate the sample CA vouches for.
          if (exec 3<>/dev/tcp/localhost/5672) 2>/dev/null; then echo "Plain AMQP (5672) should be closed"; exit 1; fi
          echo | openssl s_client -connect localhost:5671 -servername rabbitmq -CAfile deploy/tls/certs/ca.pem -verify_return_error 2>/dev/null | grep -q "Verify return code: 0 (ok)"
          # Each service has its own user; the API may only use the wake-up exchange and reads no queue.
          users=$(curl -s -u gm-admin:gm-admin-secret http://localhost:15672/api/users | jq -r '[.[].name] | sort | join(",")')
          [ "$users" = "gm-admin,gm-api,gm-consumer-a,gm-consumer-b,gm-producer" ] || { echo "users: $users"; exit 1; }
          curl -s -u gm-admin:gm-admin-secret http://localhost:15672/api/permissions/%2F/gm-api | jq -e '.read == "^$" and .write == "^gm.outbox.wake-up$"'
          curl -s -u gm-admin:gm-admin-secret http://localhost:15672/api/permissions/%2F/gm-consumer-a | jq -e '.read | contains("gm.consumer-a") and (contains("gm.consumer-b") | not)'
          # Every service is connected with its own user.
          connected=$(curl -s -u gm-admin:gm-admin-secret http://localhost:15672/api/connections | jq -r '[.[].user] | unique | sort | join(",")')
          [ "$connected" = "gm-api,gm-consumer-a,gm-consumer-b,gm-producer" ] || { echo "connected users: $connected"; exit 1; }
          # Mutual TLS: ConsumerA's user has no password, and every one of its connections signed in with its client
          # certificate (EXTERNAL); the others use passwords (PLAIN).
          curl -s -u gm-admin:gm-admin-secret http://localhost:15672/api/users/gm-consumer-a | jq -e '.password_hash == ""'
          curl -s -u gm-admin:gm-admin-secret http://localhost:15672/api/connections \
            | jq -e '([.[] | select(.user == "gm-consumer-a") | .auth_mechanism] | length > 0 and all(. == "EXTERNAL"))
                     and ([.[] | select(.user != "gm-consumer-a") | .auth_mechanism] | all(. == "PLAIN"))' \
            || { curl -s -u gm-admin:gm-admin-secret http://localhost:15672/api/connections | jq -c '[.[] | {user, auth_mechanism}]'; exit 1; }

      - name: A save in the API is published at once, not at the relays' next 30-second poll
        run: |
          pending() { docker compose exec -T postgres psql -U postgres -d messaging_api -tAc "select count(*) from messaging.outbox_messages where processed_at_utc is null"; }
          for round in 1 2 3; do
            start=$(date +%s)
            curl -sf -H 'Content-Type: application/json' http://localhost:8080/api/v1/inventory \
              -d "{\"productId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"warehouse\":\"TBS-2\",\"quantityDelta\":1,\"newQuantity\":1}" >/dev/null
            until [ "$(pending)" = "0" ]; do
              if [ $(( $(date +%s) - start )) -ge 8 ]; then
                echo "Round $round: still pending after 8 s; the wake-up didn't reach the relays."
                docker compose logs --tail 80 producer-worker api
                exit 1
              fi
              sleep 0.5
            done
            echo "Round $round: published after $(( $(date +%s) - start )) s"
          done

      - name: Prometheus has both relays' metrics, every event published once, and no inbox duplicates
        run: |
          prom() { curl -s --data-urlencode "query=$1" http://localhost:9090/api/v1/query | jq -r '.data.result[0].value[1] // "none"'; }
          check() {
            for i in $(seq 1 30); do [ "$(prom "$1")" = "$2" ] && return 0; sleep 2; done
            echo "FAILED: $1 (expected $2, got $(prom "$1"))"
            curl -s http://localhost:9090/api/v1/label/__name__/values | jq -c '.data | map(select(startswith("gm_")))'
            curl -s -G --data-urlencode 'match[]={__name__=~"gm_messaging_outbox_pending.*"}' http://localhost:9090/api/v1/series | jq -c '.data'
            exit 1
          }
          # Two relay processes (the producer worker replicas) report their outbox gauge.
          check 'count(count by (service_instance_id) ({__name__=~"gm_messaging_outbox_pending.*", job="GM.Messaging.Sample.Producer.Worker"}))' 2
          # Nine events (six above, three in the wake-up rounds), each published by exactly one relay.
          check 'sum({__name__=~"gm_messaging_outbox_published.*_total"})' 9
          # The consumers handled events, and none saw an event twice (a duplicate publish would show here).
          check 'sum({__name__=~"gm_messaging_inbox_processed.*_total"}) > bool 0' 1
          check 'sum({__name__=~"gm_messaging_inbox_duplicates.*_total"}) or vector(0)' 0

      - name: The admin endpoints and health checks report the backlog and dead letters
        env:
          ADMIN_KEY: sample-admin-key   # Admin__ApiKey in docker-compose.yml
        run: |
          set -e
          # An admin call with the key; on anything but 2xx it prints the status, the body and the host's logs.
          admin() {
            local code
            code=$(curl -s -o /tmp/admin-body -w '%{http_code}' -H "X-Admin-Key: $ADMIN_KEY" "$@")
            if [ "${code:0:1}" != "2" ]; then
              echo "FAILED $* -> HTTP $code: $(cat /tmp/admin-body)" >&2
              docker compose logs --tail 60 >&2
              return 1
            fi
            cat /tmp/admin-body
          }
          # GM.Messaging.AspNetCore's endpoints require the messaging-admin policy: no key or a wrong one is refused.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/admin/messaging/outbox)" = "401" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Admin-Key: wrong' http://localhost:8082/admin/messaging/inbox)" = "401" ]
          # Every host maps what it has: the producer workers their outbox, ConsumerA its inbox (the XXX order).
          admin http://localhost:8083/admin/messaging/outbox | jq -e '.pending == 0'
          admin http://localhost:8081/admin/messaging/inbox/dead-letters | jq -e 'length == 1 and .[0].retriedByInboxWorker == false'
          # Outbox (API): nothing pending or dead-lettered.
          admin http://localhost:8080/admin/messaging/outbox | jq -e '.pending == 0 and .deadLettered == 0'
          admin http://localhost:8080/admin/messaging/outbox/dead-letters | jq -e 'length == 0'
          curl -s http://localhost:8080/health/ready | grep -q 'messaging-backlog'
          # ConsumerB's inbox: the bounced welcome email is its one dead letter.
          admin http://localhost:8082/admin/messaging/inbox | jq -e '.deadLettered == 1'
          admin http://localhost:8082/admin/messaging/inbox/dead-letters | jq -e 'length == 1 and .[0].consumerName == "consumer-b"'
          # Nothing was published without a queue to receive it.
          admin http://localhost:8082/admin/messaging/broker/unrouted | jq -e '.messages == 0'
          # The XXX order reached the broker's dead-letter queue after ConsumerA's last retry.
          for i in $(seq 1 30); do
            if admin http://localhost:8082/admin/messaging/broker/dead-letters | jq -e '.messages >= 1' >/dev/null; then break; fi
            if [ "$i" = 30 ]; then echo "The XXX order never reached gm.dead-letters"; exit 1; fi
            sleep 2
          done
          # Found by its payload; the sample shows bodies with [SensitiveData] masked, and an order has none, so it's readable.
          admin "http://localhost:8082/admin/messaging/broker/dead-letters/messages?contains=XXX" | jq -e 'length >= 1 and all(.[]; .body | contains("XXX"))'
          # A filtered dry run counts the XXX order without replaying it; one for another queue matches nothing.
          before=$(admin http://localhost:8082/admin/messaging/broker/dead-letters | jq '.messages')
          admin -X POST "http://localhost:8082/admin/messaging/broker/dead-letters/replay?queue=gm.consumer-a.orders&dryRun=true" | jq -e '.matched >= 1 and .transferred == 0'
          admin -X POST "http://localhost:8082/admin/messaging/broker/dead-letters/replay?queue=no-such-queue" | jq -e '.matched == 0 and .transferred == 0'
          [ "$(admin http://localhost:8082/admin/messaging/broker/dead-letters | jq '.messages')" = "$before" ]
          # Every worker's readiness includes its backlog check.
          for port in 8081 8082 8083 8084; do curl -s "http://localhost:$port/health/ready" | grep -q 'messaging-backlog'; done

      - name: Recovery — fix ConsumerA, replay its dead letter, and it's handled once
        env:
          ADMIN_KEY: sample-admin-key
        run: |
          set -e
          q() { docker compose exec -T postgres psql -U postgres -d "$1" -tAc "$2"; }
          admin() { curl -sf -H "X-Admin-Key: $ADMIN_KEY" "$@"; }
          dead_before=$(admin http://localhost:8082/admin/messaging/broker/dead-letters | jq '.messages')
          [ "$dead_before" -ge 1 ]
          # "Deploy the fix": ConsumerA now accepts orders in XXX.
          admin -X POST http://localhost:8081/admin/sample/accept-failing-currency
          # Replay the dead-lettered order to ConsumerA's queue (ConsumerB's admin endpoints serve the shared dead-letter queue).
          admin -X POST "http://localhost:8082/admin/messaging/broker/dead-letters/replay?queue=gm.consumer-a.orders" | jq -e '.transferred == 1'
          for i in $(seq 1 30); do
            [ "$(q messaging_consumer_a "select count(*) from application.customer_activities")" = "5" ] && break
            [ "$i" = 30 ] && { echo "The replayed order wasn't booked"; docker compose logs --tail 60 consumer-a; exit 1; }
            sleep 2
          done
          # Its inbox row is processed now (no longer dead-lettered), and the dead-letter queue is one shorter.
          [ "$(q messaging_consumer_a "select count(*) from messaging.inbox_messages where error like '%XXX%' and processed_at_utc is not null and dead_lettered_at_utc is null")" = "1" ]
          [ "$(admin http://localhost:8082/admin/messaging/broker/dead-letters | jq '.messages')" = "$((dead_before - 1))" ]

      - name: Unrouted — a message no queue is bound for is kept, then moved once one exists
        env:
          ADMIN_KEY: sample-admin-key
        run: |
          set -e
          mq() { curl -sf -u gm-admin:gm-admin-secret -H 'content-type: application/json' "$@"; }
          admin() { curl -sf -H "X-Admin-Key: $ADMIN_KEY" "$@"; }
          # A new kind of event goes out before any consumer for it exists: the API publishes ReturnRequested
          # (routing key returns.requested), no queue is bound for it, and RabbitMQ hands it to gm.unrouted.
          return_id=$(cat /proc/sys/kernel/random/uuid)
          curl -sf -H 'Content-Type: application/json' http://localhost:8080/api/v1/returns \
            -d "{\"returnId\":\"$return_id\",\"orderId\":\"$ORDER\",\"customerId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"contactEmail\":\"ana@example.test\",\"reason\":\"Wrong size\"}" > /dev/null
          for i in $(seq 1 15); do [ "$(admin http://localhost:8082/admin/messaging/broker/unrouted | jq '.messages')" = "1" ] && break; sleep 1; done
          # The admin endpoints show it with the contract's [SensitiveData] (the contact email) masked, the rest readable.
          admin "http://localhost:8082/admin/messaging/broker/unrouted/messages" > /tmp/unrouted.json
          jq -e --arg id "$return_id" '.[0].routingKey == "returns.requested"
              and (.[0].body | fromjson | .ContactEmail == "***" and .Reason == "Wrong size" and .ReturnId == $id)' /tmp/unrouted.json \
            || { cat /tmp/unrouted.json; exit 1; }
          # The returns consumer's queue appears; moving the kept message delivers it there.
          mq -X PUT http://localhost:15672/api/queues/%2F/gm.returns -d '{"durable":true}' > /dev/null
          mq -X POST http://localhost:15672/api/bindings/%2F/e/gm.events/q/gm.returns -d '{"routing_key":"returns.#"}' > /dev/null
          admin -X POST "http://localhost:8082/admin/messaging/broker/unrouted/move?exchange=gm.events" | jq -e '.transferred == 1'
          [ "$(admin http://localhost:8082/admin/messaging/broker/unrouted | jq '.messages')" = "0" ]
          for i in $(seq 1 15); do [ "$(mq http://localhost:15672/api/queues/%2F/gm.returns | jq '.messages')" = "1" ] && exit 0; sleep 1; done
          echo "The moved message didn't reach gm.returns"; exit 1

      - name: An old producer's version-1 event is upcast on the wire
        run: |
          set -e
          q() { docker compose exec -T postgres psql -U postgres -d "$1" -tAc "$2"; }
          # A producer still on InventoryUpdated v1 (Warehouse, not WarehouseCode) publishes straight to RabbitMQ, with
          # its version in the gm-event-version header; ConsumerB runs the upcaster before handling it.
          type=GM.Messaging.Sample.Domain.Events.Inventory.InventoryUpdatedIntegrationEvent
          event=$(cat /proc/sys/kernel/random/uuid)
          payload=$(jq -cn --arg e "$event" --arg p "$(cat /proc/sys/kernel/random/uuid)" '{EventId:$e,OccurredAtUtc:"2026-11-01T10:00:00Z",ProductId:$p,Warehouse:"LEGACY-1",QuantityDelta:2,NewQuantity:7} | tostring')
          body=$(jq -cn --arg t "$type" --arg id "$event" --argjson payload "$payload" \
            '{properties:{type:$t,message_id:$id,content_type:"application/json",headers:{"message-type":$t,"gm-event-version":"1","content-type":"application/json"}},routing_key:"inventory.updated",payload:$payload,payload_encoding:"string"}')
          curl -sf -u gm-admin:gm-admin-secret -H 'content-type: application/json' -X POST http://localhost:15672/api/exchanges/%2F/gm.events/publish -d "$body" | jq -e '.routed == true'
          for i in $(seq 1 30); do
            [ "$(q messaging_consumer_b "select quantity from application.stock_levels where warehouse_code = 'LEGACY-1'")" = "7" ] && exit 0
            sleep 2
          done
          echo "ConsumerB didn't handle the version-1 event"; docker compose logs --tail 60 consumer-b; exit 1

      - name: Erasure — deleting a user's key makes their personal data unreadable everywhere
        env:
          ADMIN_KEY: sample-admin-key
        run: |
          set -e
          q() { docker compose exec -T postgres psql -U postgres -d "$1" -tAc "$2"; }
          user=$(cat /proc/sys/kernel/random/uuid)
          echo "ERASED_USER=$user" >> "$GITHUB_ENV"
          curl -sf -H 'Content-Type: application/json' http://localhost:8080/api/v1/users \
            -d "{\"userId\":\"$user\",\"email\":\"erase-me@example.test\",\"name\":\"Erase Me\"}" > /dev/null
          for i in $(seq 1 30); do
            [ "$(q messaging_consumer_b "select count(*) from application.welcome_emails where email = 'erase-me@example.test'")" = "1" ] && break
            [ "$i" = 30 ] && { echo "The new user's welcome email wasn't sent"; docker compose logs --tail 60 consumer-b; exit 1; }
            sleep 2
          done
          [ "$(q messaging_keys "select count(*) from messaging.subject_keys where subject_id = '$user'")" = "1" ]
          # The erasure request: the API's admin endpoint deletes the user's key (a second request finds none).
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "X-Admin-Key: $ADMIN_KEY" "http://localhost:8080/admin/messaging/subject-keys/$user")" = "204" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "X-Admin-Key: $ADMIN_KEY" "http://localhost:8080/admin/messaging/subject-keys/$user")" = "404" ]
          [ "$(q messaging_keys "select count(*) from messaging.subject_keys where subject_id = '$user'")" = "0" ]
          # The event is still in the outbox and the inboxes, but its email and name can't be decrypted any more
          # (the stack tests read it back). Copies a service made itself (ConsumerB's welcome_emails) are its own to delete.

      - name: Key rotation — switch to the Data Protection-protected key, then re-wrap every user's key
        env:
          ADMIN_KEY: sample-admin-key
        run: |
          set -e
          q() { docker compose exec -T postgres psql -U postgres -d "$1" -tAc "$2"; }
          admin() { curl -sf -H "X-Admin-Key: $ADMIN_KEY" "$@"; }
          # Deploy with sample-2026-12 (a dp: value, unprotected with the keys in deploy/dataprotection) as the current key.
          SAMPLE_CURRENT_KEY_ID=sample-2026-12 docker compose up -d --no-build --scale producer-worker=2
          ready() { curl -sf "http://localhost:$1/health/ready" >/dev/null; }
          for i in $(seq 1 90); do
            ready 8080 && ready 8081 && ready 8082 && ready 8083 && ready 8084 && break
            [ "$i" = 90 ] && { docker compose ps; docker compose logs --tail 60; exit 1; }
            sleep 2
          done
          docker compose exec -T api printenv Messaging__SensitiveData__CurrentKeyId | grep -qx sample-2026-12
          # The stored keys are still wrapped with sample-2026-11; re-wrapping moves them all to sample-2026-12.
          old=$(q messaging_keys "select count(*) from messaging.subject_keys where wrapped_key not like 'k1:sample-2026-12:%'")
          [ "$old" -ge 1 ]
          admin -X POST http://localhost:8080/admin/messaging/subject-keys/rewrap | jq -e ". == $old"
          [ "$(q messaging_keys "select count(*) from messaging.subject_keys where wrapped_key not like 'k1:sample-2026-12:%'")" = "0" ]
          admin -X POST http://localhost:8080/admin/messaging/subject-keys/rewrap | jq -e '. == 0'
          # Everything still flows: a user registered now gets a key wrapped with the new key and a welcome email.
          user=$(cat /proc/sys/kernel/random/uuid)
          curl -sf -H 'Content-Type: application/json' http://localhost:8080/api/v1/users \
            -d "{\"userId\":\"$user\",\"email\":\"rotated@example.test\",\"name\":\"Rotated\"}" > /dev/null
          for i in $(seq 1 30); do
            [ "$(q messaging_consumer_b "select count(*) from application.welcome_emails where email = 'rotated@example.test'")" = "1" ] && break
            [ "$i" = 30 ] && { echo "No welcome email after the rotation"; docker compose logs --tail 60 consumer-b api; exit 1; }
            sleep 2
          done
          [ "$(q messaging_keys "select wrapped_key like 'k1:sample-2026-12:%' from messaging.subject_keys where subject_id = '$user'")" = "t" ]

      - name: Stack tests (GM.Testing.Messaging.Integration against the running stack)
        env:
          SAMPLE_STACK: "true"
        run: dotnet test tests/GM.Messaging.Sample.StackTests -c Release --logger "console;verbosity=normal"

      - name: Logs
        if: always()
        run: docker compose logs --tail 200
