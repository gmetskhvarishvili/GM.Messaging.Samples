# TLS only: the plain AMQP port is closed, clients connect on 5671 with the sample CA's certificate.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /tls/ca.pem
ssl_options.certfile = /tls/server.pem
ssl_options.keyfile = /tls/server.key
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
# Mutual TLS where a client offers a certificate (ConsumerA): it must be signed by the sample CA. Clients
# without one (the other services) still connect, with a password.
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false
# EXTERNAL signs a client in as the user named by its certificate's common name (rabbitmq_auth_mechanism_ssl).
auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN
auth_mechanisms.3 = EXTERNAL
ssl_cert_login_from = common_name
