# Scrapes the OpenTelemetry collector, which holds every service's metrics (GM.Messaging's
# gm_messaging_* and Wolverine's). Query them at http://localhost:9090.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
