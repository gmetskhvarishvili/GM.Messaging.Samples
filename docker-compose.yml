# The whole GM.Messaging sample: PostgreSQL, RabbitMQ, the API, the producer worker (outbox relay) and two consumers.
#
#   docker compose up -d --build                                              # everything
#   docker compose up -d --build --scale producer-worker=2                    # two relays (CI runs this)
#   docker compose up -d postgres rabbitmq-setup                              # just the infrastructure
#
# UIs and endpoints:
#   API + Swagger           http://localhost:8080
#   RabbitMQ management     http://localhost:15672 (gm-admin / gm-admin-secret)
#   RabbitMQ (AMQP)         amqps://localhost:5671, TLS only (certificates from deploy/tls/generate.sh)
#   Consumer A              http://localhost:8081/health/ready
#   Consumer B              http://localhost:8082/health/ready, /admin/messaging/inbox, /admin/messaging/broker/...
#   Admin endpoints         /admin/messaging/... on every host
#   Producer worker(s)      http://localhost:8083/health/ready (and 8084 for the second replica)
#
# The API applies the application database's migrations; the producer worker waits for them. Each consumer
# migrates its own database. Saves in the API wake the relays over RabbitMQ, so events are published at once
# even though the relays only poll every 30 seconds.
#
# Security: RabbitMQ accepts only TLS, with a sample CA generated on first start that the services trust
# (Messaging__RabbitMq__TlsCaCertificatePath). Each service has its own RabbitMQ user, limited to the exchanges
# and queues it uses (deploy/rabbitmq/setup.sh); ConsumerA signs in with a client certificate (mutual TLS).
# Personal data in events ([SensitiveData]) is encrypted with the key ring below, with a key per person. These are sample secrets: in production they come from a secret store.

x-messaging: &messaging
  Messaging__RabbitMq__HostName: rabbitmq
  Messaging__RabbitMq__Port: "5671"
  Messaging__RabbitMq__UseTls: "true"
  Messaging__RabbitMq__TlsCaCertificatePath: /tls/ca.pem
  # Quorum queues: every durable queue GM.Messaging declares is replicated across the cluster (one node here).
  Messaging__RabbitMq__QueueType: Quorum
  # Queue limits: a consumer queue holds at most 100000 messages (a full one refuses more, so events wait in the outbox),
  # and the dead-letter and unrouted queues drop messages after two weeks.
  Messaging__RabbitMq__MaxQueueLength: "100000"
  Messaging__RabbitMq__DeadLetterRetentionHours: "336"
  Messaging__RabbitMq__UnroutedRetentionHours: "336"
  # Events above 64 KB (the bulk stock import) go through the claim check: the body in the shared gm-claim-checks
  # volume, a reference on RabbitMQ.
  Messaging__LargeMessages__OffloadAboveBytes: "65536"
  Messaging__LargeMessages__FileSystemPath: /claim-checks
  # The key ring for [SensitiveData] values: every producer and consumer of those events has the same one.
  # sample-2026-12 is protected with Data Protection (dp:, keys in deploy/dataprotection); CI rotates to it with
  # SAMPLE_CURRENT_KEY_ID=sample-2026-12 and then re-wraps the per-person keys.
  Messaging__SensitiveData__CurrentKeyId: ${SAMPLE_CURRENT_KEY_ID:-sample-2026-11}
  Messaging__SensitiveData__Keys__sample-2026-11: 0jhLQs7AjRkn9OLKULOvcGKQOili1qobbLtbx54iNF8=
  Messaging__SensitiveData__Keys__sample-2026-12: dp:CfDJ8IIqVXqQTlBMilxVLWaETfAH3NReVOPVIFJ6UbB3qhIc7PXLy2UrutkS0fXR92g3HxZfj1O-4mGsVlEoL5UpPFpeC90SXkIRCPXE0hdbyvz5cYetpgOl0gAH9udV0hRLPGVp6ZoB3P7PxSMKhLfZVE2kGSamIx09En7r_IwM3CyM
  Messaging__SensitiveData__DataProtection__KeysPath: /dataprotection
  # Per-person keys ([DataSubject]), shared by every service that reads those events; GM.Messaging creates the table.
  ConnectionStrings__SubjectKeys: "Host=postgres;Port=5432;Database=messaging_keys;Username=postgres;Password=123456"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gm-messaging-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - gm-messaging-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Generates the sample CA and RabbitMQ's certificate into deploy/tls/certs, once.
  tls-certs:
    image: alpine:3.20
    container_name: gm-messaging-tls-certs
    command: ["sh", "/scripts/generate.sh"]
    volumes:
      - ./deploy/tls:/scripts:ro
      - ./deploy/tls/certs:/certs

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: gm-messaging-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: gm-admin
      RABBITMQ_DEFAULT_PASS: gm-admin-secret
    volumes:
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-gm.conf:ro
      # The management UI, Prometheus metrics, and EXTERNAL authentication (client certificates).
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/tls/certs:/tls:ro
    ports:
      - "5671:5671"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
    depends_on:
      tls-certs:
        condition: service_completed_successfully

  # One RabbitMQ user per service, with scoped permissions.
  rabbitmq-setup:
    image: curlimages/curl:8.11.0
    container_name: gm-messaging-rabbitmq-setup
    entrypoint: ["sh", "/setup.sh"]
    environment:
      RABBITMQ_ADMIN_USER: gm-admin
      RABBITMQ_ADMIN_PASSWORD: gm-admin-secret
      GM_API_PASSWORD: api-secret
      GM_PRODUCER_PASSWORD: producer-secret
      GM_CONSUMER_B_PASSWORD: consumer-b-secret
    volumes:
      - ./deploy/rabbitmq/setup.sh:/setup.sh:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  api:
    build:
      context: .
      args:
        PROJECT: GM.Messaging.Sample.API
    container_name: gm-messaging-api
    environment:
      <<: *messaging
      ASPNETCORE_ENVIRONMENT: Development
      Messaging__ServiceName: GM.Messaging.Sample.API
      Messaging__RabbitMq__UserName: gm-api
      Messaging__RabbitMq__Password: api-secret
      ConnectionStrings__ApplicationDatabase: "Host=postgres;Port=5432;Database=messaging_api;Username=postgres;Password=123456"
    volumes:
      - ./deploy/tls/certs:/tls:ro
      - ./deploy/dataprotection:/dataprotection:ro
      - gm-claim-checks:/claim-checks
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-setup:
        condition: service_completed_successfully

  producer-worker:
    build:
      context: .
      args:
        PROJECT: GM.Messaging.Sample.Producer.Worker
    # No container_name, so it can run as several replicas (the relay leases messages); a port range so
    # each replica's health endpoint is reachable.
    environment:
      <<: *messaging
      Messaging__RabbitMq__UserName: gm-producer
      Messaging__RabbitMq__Password: producer-secret
      ConnectionStrings__ApplicationDatabase: "Host=postgres;Port=5432;Database=messaging_api;Username=postgres;Password=123456"
    volumes:
      - ./deploy/tls/certs:/tls:ro
      - ./deploy/dataprotection:/dataprotection:ro
      - gm-claim-checks:/claim-checks
    ports:
      - "8083-8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-setup:
        condition: service_completed_successfully
      api:
        condition: service_started

  consumer-a:
    build:
      context: .
      args:
        PROJECT: GM.Messaging.Sample.ConsumerA.Worker
    container_name: gm-messaging-consumer-a
    environment:
      <<: *messaging
      # Mutual TLS: signs in with its client certificate (EXTERNAL), not a password.
      Messaging__RabbitMq__UserName: gm-consumer-a
      Messaging__RabbitMq__TlsClientCertificatePath: /tls/consumer-a.pem
      Messaging__RabbitMq__TlsClientKeyPath: /tls/consumer-a.key
      Messaging__RabbitMq__UseExternalAuthentication: "true"
      ConnectionStrings__ApplicationDatabase: "Host=postgres;Port=5432;Database=messaging_consumer_a;Username=postgres;Password=123456"
    volumes:
      - ./deploy/tls/certs:/tls:ro
      - ./deploy/dataprotection:/dataprotection:ro
      - gm-claim-checks:/claim-checks
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-setup:
        condition: service_completed_successfully

  consumer-b:
    build:
      context: .
      args:
        PROJECT: GM.Messaging.Sample.ConsumerB.Worker
    container_name: gm-messaging-consumer-b
    environment:
      <<: *messaging
      Messaging__RabbitMq__UserName: gm-consumer-b
      Messaging__RabbitMq__Password: consumer-b-secret
      ConnectionStrings__ApplicationDatabase: "Host=postgres;Port=5432;Database=messaging_consumer_b;Username=postgres;Password=123456"
    volumes:
      - ./deploy/tls/certs:/tls:ro
      - ./deploy/dataprotection:/dataprotection:ro
      - gm-claim-checks:/claim-checks
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-setup:
        condition: service_completed_successfully

volumes:
  gm-messaging-pgdata:
  gm-claim-checks:
